<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ZIKKY MANGA HUB - DEV ZIKKY TECH</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <style>
    /* ============== CSS VARIABLES ============== */
    :root {
        --primary: #8b17b6;
        --primary-glow: rgba(139, 23, 182, 0.4);
        --secondary: #00ffea;
        --secondary-glow: rgba(0, 255, 234, 0.3);
        --accent: #ff2a6d;
        --accent-glow: rgba(255, 42, 109, 0.3);
        --text: #f0f0f0;
        --text-muted: #a0a0a0;
        --bg: #0a0a12;
        --card-bg: rgba(18, 18, 28, 0.95);
        --card-border: rgba(139, 23, 182, 0.3);
        --hover: rgba(139, 23, 182, 0.2);
        --border: rgba(139, 23, 182, 0.5);
        --success: #00ff88;
        --error: #ff2a6d;
        --neon: 0 0 15px var(--primary-glow);
        --transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
    }

    body.light-theme {
        --text: #1a1a2e;
        --text-muted: #4a4a6a;
        --bg: #f0f0f5;
        --card-bg: rgba(255, 255, 255, 0.95);
        --card-border: rgba(139, 23, 182, 0.2);
        --hover: rgba(139, 23, 182, 0.05);
        --border: rgba(139, 23, 182, 0.3);
        background: linear-gradient(135deg, #f5f5fa, #e8e8f0);
    }

    * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
    }

    body {
        font-family: 'Inter', sans-serif;
        background: linear-gradient(135deg, #0a0a12, #1a0a2a, #0a122a);
        color: var(--text);
        min-height: 100vh;
        overflow-x: hidden;
        transition: var(--transition);
    }

    body::before {
        content: '';
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: 
            radial-gradient(circle at 20% 80%, var(--primary-glow), transparent 40%),
            radial-gradient(circle at 80% 20%, var(--secondary-glow), transparent 40%);
        z-index: -2;
        opacity: 0.3;
        animation: bgPulse 8s ease infinite;
    }

    @keyframes bgPulse {
        0%, 100% { opacity: 0.3; }
        50% { opacity: 0.5; }
    }

    /* ============== PARTICLES ============== */
    .particles {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        pointer-events: none;
        z-index: -1;
    }

    .particle {
        position: absolute;
        background: var(--primary);
        border-radius: 50%;
        opacity: 0.3;
        animation: floatParticle linear infinite;
    }

    @keyframes floatParticle {
        0% { transform: translateY(100vh) translateX(0); opacity: 0; }
        10% { opacity: 0.8; }
        90% { opacity: 0.8; }
        100% { transform: translateY(-100px) translateX(100px); opacity: 0; }
    }

    /* ============== NAVBAR ============== */
    .navbar {
        position: fixed;
        top: 0;
        left: 0;
        right: 0;
        background: var(--card-bg);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
        border-bottom: 2px solid var(--primary);
        padding: 1rem 2rem;
        display: flex;
        align-items: center;
        justify-content: space-between;
        z-index: 1000;
        box-shadow: var(--neon);
        animation: borderGlow 4s infinite;
    }

    @keyframes borderGlow {
        0%, 100% { border-bottom-color: var(--primary); }
        33% { border-bottom-color: var(--secondary); }
        66% { border-bottom-color: var(--accent); }
    }

    .nav-brand {
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .brand-logo {
        width: 40px;
        height: 40px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        border-radius: 10px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 20px;
        color: white;
        animation: floatLogo 3s ease infinite;
    }

    @keyframes floatLogo {
        0%, 100% { transform: translateY(0); }
        50% { transform: translateY(-5px); }
    }

    .brand-name {
        font-size: 1.5rem;
        font-weight: 700;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .brand-highlight {
        background: linear-gradient(135deg, var(--secondary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        margin-left: 5px;
    }

    .menu-toggle {
        display: none;
        font-size: 1.5rem;
        cursor: pointer;
        color: var(--text);
        transition: var(--transition);
        background: none;
        border: none;
    }

    .menu-toggle:hover {
        color: var(--primary);
        transform: scale(1.1);
    }

    .nav-links {
        display: flex;
        gap: 20px;
        align-items: center;
    }

    .nav-links a {
        color: var(--text-muted);
        text-decoration: none;
        font-weight: 500;
        padding: 8px 15px;
        border-radius: 20px;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 8px;
        position: relative;
        overflow: hidden;
    }

    .nav-links a::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, var(--primary-glow), transparent);
        transition: left 0.5s ease;
    }

    .nav-links a:hover::before {
        left: 100%;
    }

    .nav-links a:hover, 
    .nav-links a.active {
        color: var(--text);
        background: var(--hover);
        box-shadow: 0 0 15px var(--primary-glow);
    }

    .theme-toggle {
        background: var(--card-bg);
        border: 2px solid var(--primary);
        color: var(--text);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        display: flex;
        align-items: center;
        justify-content: center;
        transition: var(--transition);
        flex-shrink: 0;
    }

    .theme-toggle:hover {
        transform: rotate(180deg);
        box-shadow: var(--neon);
    }

    /* ============== MAIN CONTAINER ============== */
    .main-container {
        margin-top: 80px;
        padding: 20px;
        min-height: calc(100vh - 80px);
    }

    /* ============== HERO SECTION ============== */
    .hero-section {
        text-align: center;
        padding: 50px 20px;
        background: var(--card-bg);
        border-radius: 30px;
        margin-bottom: 30px;
        border: 2px solid var(--primary);
        box-shadow: var(--neon);
        position: relative;
        overflow: hidden;
    }

    .hero-section::before {
        content: '';
        position: absolute;
        top: -50%;
        left: -50%;
        width: 200%;
        height: 200%;
        background: linear-gradient(45deg, transparent 30%, var(--primary-glow) 50%, transparent 70%);
        animation: shineEffect 8s infinite;
        pointer-events: none;
    }

    @keyframes shineEffect {
        0% { transform: translateX(-100%) translateY(-100%) rotate(45deg); }
        100% { transform: translateX(100%) translateY(100%) rotate(45deg); }
    }

    .hero-content {
        position: relative;
        z-index: 1;
    }

    .hero-title {
        font-size: 3rem;
        margin-bottom: 20px;
    }

    .gradient-text {
        background: linear-gradient(135deg, var(--primary), var(--secondary), var(--accent));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
        background-size: 200% 200%;
        animation: gradientShift 5s ease infinite;
    }

    @keyframes gradientShift {
        0%, 100% { background-position: 0% 50%; }
        50% { background-position: 100% 50%; }
    }

    .hero-subtitle {
        color: var(--text-muted);
        font-size: 1.2rem;
        margin-bottom: 30px;
    }

    /* ============== SEARCH ============== */
    .search-container {
        display: flex;
        max-width: 600px;
        margin: 0 auto 30px;
        gap: 10px;
    }

    .search-container input {
        flex: 1;
        padding: 15px 20px;
        border: 2px solid var(--border);
        border-radius: 30px;
        background: rgba(0, 0, 0, 0.3);
        color: var(--text);
        font-size: 1rem;
        transition: var(--transition);
        outline: none;
    }

    .search-container input:focus {
        border-color: var(--primary);
        box-shadow: 0 0 20px var(--primary-glow);
    }

    .search-container input::placeholder {
        color: var(--text-muted);
        opacity: 0.7;
    }

    .search-container button {
        padding: 15px 30px;
        border: none;
        border-radius: 30px;
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: white;
        font-weight: 600;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        gap: 10px;
        white-space: nowrap;
    }

    .search-container button:hover {
        transform: translateY(-2px);
        box-shadow: 0 5px 20px var(--primary-glow);
    }

    /* ============== GENRE FILTERS ============== */
    .genre-filters {
        display: flex;
        gap: 10px;
        flex-wrap: wrap;
        justify-content: center;
    }

    .filter-btn {
        padding: 10px 20px;
        border: 2px solid var(--border);
        border-radius: 25px;
        background: transparent;
        color: var(--text-muted);
        font-weight: 500;
        cursor: pointer;
        transition: var(--transition);
        position: relative;
        overflow: hidden;
    }

    .filter-btn::before {
        content: '';
        position: absolute;
        top: 0;
        left: -100%;
        width: 100%;
        height: 100%;
        background: linear-gradient(90deg, transparent, var(--primary-glow), transparent);
        transition: left 0.5s ease;
    }

    .filter-btn:hover::before {
        left: 100%;
    }

    .filter-btn:hover, 
    .filter-btn.active {
        background: linear-gradient(135deg, var(--primary), var(--accent));
        color: white;
        border-color: transparent;
        box-shadow: 0 0 15px var(--primary-glow);
    }

    /* ============== MANGA GRID ============== */
    .manga-grid {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 25px;
        padding: 20px 0;
    }

    .manga-card {
        background: var(--card-bg);
        border: 2px solid var(--card-border);
        border-radius: 15px;
        overflow: hidden;
        cursor: pointer;
        transition: var(--transition);
        animation: cardFadeIn 0.5s ease;
    }

    @keyframes cardFadeIn {
        from { opacity: 0; transform: translateY(20px); }
        to { opacity: 1; transform: translateY(0); }
    }

    .manga-card:hover {
        transform: translateY(-10px) scale(1.02);
        border-color: var(--primary);
        box-shadow: 0 10px 30px var(--primary-glow);
    }

    .manga-card img {
        width: 100%;
        height: 280px;
        object-fit: cover;
        transition: var(--transition);
        display: block;
    }

    .manga-card:hover img {
        transform: scale(1.05);
    }

    .manga-info {
        padding: 15px;
        background: linear-gradient(to top, var(--card-bg), transparent);
    }

    .manga-title {
        font-weight: 600;
        margin-bottom: 8px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        font-size: 0.95rem;
    }

    .manga-stats {
        display: flex;
        justify-content: space-between;
        color: var(--text-muted);
        font-size: 0.85rem;
        align-items: center;
    }

    .manga-stats i {
        margin-right: 3px;
    }

    .manga-stats .fa-star {
        color: #ffd700;
    }

    /* ============== END RESULTS ============== */
    .end-results {
        text-align: center;
        padding: 40px 20px;
        margin: 20px 0;
        background: var(--card-bg);
        border: 2px solid var(--border);
        border-radius: 20px;
    }

    .end-results-content {
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 15px;
    }

    .end-results-content i {
        font-size: 3rem;
        color: var(--success);
        animation: iconPulse 2s infinite;
    }

    @keyframes iconPulse {
        0%, 100% { transform: scale(1); }
        50% { transform: scale(1.1); }
    }

    /* ============== DETAILS PAGE ============== */
    .details-page {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: var(--bg);
        z-index: 2000;
        overflow-y: auto;
        padding: 80px 20px 40px;
        animation: slideIn 0.3s ease;
    }

    @keyframes slideIn {
        from { transform: translateX(100%); opacity: 0; }
        to { transform: translateX(0); opacity: 1; }
    }

    .details-container {
        max-width: 1200px;
        margin: 0 auto;
    }

    .back-button {
        background: var(--card-bg);
        border: 2px solid var(--primary);
        color: var(--text);
        padding: 12px 25px;
        border-radius: 30px;
        cursor: pointer;
        display: inline-flex;
        align-items: center;
        gap: 10px;
        font-size: 1rem;
        font-weight: 600;
        margin-bottom: 30px;
        transition: var(--transition);
    }

    .back-button:hover {
        transform: translateX(-5px);
        box-shadow: var(--neon);
    }

    .manga-details-wrapper {
        background: var(--card-bg);
        border: 3px solid var(--primary);
        border-radius: 30px;
        padding: 40px;
        box-shadow: var(--neon);
    }

    .manga-details-grid {
        display: grid;
        grid-template-columns: 300px 1fr;
        gap: 40px;
        margin-bottom: 40px;
    }

    .details-cover {
        width: 100%;
        border-radius: 20px;
        border: 3px solid var(--border);
        box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        display: block;
    }

    .details-info h2 {
        font-size: 2.2rem;
        margin-bottom: 20px;
        background: linear-gradient(135deg, var(--primary), var(--secondary));
        -webkit-background-clip: text;
        -webkit-text-fill-color: transparent;
        background-clip: text;
    }

    .details-synopsis {
        color: var(--text-muted);
        line-height: 1.8;
        margin-bottom: 25px;
        max-height: 200px;
        overflow-y: auto;
        padding-right: 10px;
        scrollbar-width: thin;
    }

    .details-synopsis::-webkit-scrollbar {
        width: 4px;
    }

    .details-synopsis::-webkit-scrollbar-track {
        background: transparent;
    }

    .details-synopsis::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 4px;
    }

    .details-stats {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
        gap: 12px;
        background: rgba(0,0,0,0.2);
        border-radius: 15px;
        padding: 20px;
        margin-bottom: 25px;
    }

    .stat-item {
        display: flex;
        flex-direction: column;
        gap: 4px;
        padding: 8px 12px;
        background: rgba(255,255,255,0.05);
        border-radius: 10px;
        transition: var(--transition);
    }

    .stat-item:hover {
        background: rgba(139, 23, 182, 0.15);
        transform: translateY(-2px);
    }

    .stat-label {
        color: var(--text-muted);
        font-size: 0.75rem;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .stat-label i {
        color: var(--primary);
        margin-right: 5px;
        width: 16px;
    }

    .stat-value {
        font-weight: 600;
        font-size: 1.1rem;
    }

    .details-genres {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        margin-bottom: 25px;
    }

    .genre-tag {
        background: var(--hover);
        border: 1px solid var(--border);
        padding: 8px 15px;
        border-radius: 20px;
        font-size: 0.85rem;
        transition: var(--transition);
    }

    .genre-tag:hover {
        border-color: var(--primary);
        background: var(--primary);
        color: white;
    }

    /* ============== CHAPTERS SECTION ============== */
    .chapters-section {
        margin-top: 40px;
        border-top: 2px solid var(--border);
        padding-top: 30px;
    }

    .chapters-section h3 {
        margin-bottom: 20px;
        display: flex;
        align-items: center;
        gap: 10px;
    }

    .chapter-list {
        max-height: 400px;
        overflow-y: auto;
        border: 1px solid var(--border);
        border-radius: 10px;
        scrollbar-width: thin;
    }

    .chapter-list::-webkit-scrollbar {
        width: 4px;
    }

    .chapter-list::-webkit-scrollbar-track {
        background: transparent;
    }

    .chapter-list::-webkit-scrollbar-thumb {
        background: var(--primary);
        border-radius: 4px;
    }

    .chapter-item {
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 15px 20px;
        border-bottom: 1px solid var(--border);
        cursor: pointer;
        transition: var(--transition);
    }

    .chapter-item:last-child {
        border-bottom: none;
    }

    .chapter-item:hover {
        background: var(--hover);
    }

    .chapter-info {
        display: flex;
        gap: 15px;
        align-items: center;
        flex-wrap: wrap;
    }

    .chapter-number {
        font-weight: 600;
        color: var(--primary);
    }

    .chapter-pages {
        color: var(--text-muted);
        font-size: 0.85rem;
    }

    .chapter-actions {
        display: flex;
        gap: 8px;
        flex-shrink: 0;
    }

    .chapter-action-btn {
        background: var(--hover);
        border: 1px solid var(--border);
        color: var(--text);
        width: 35px;
        height: 35px;
        border-radius: 5px;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .chapter-action-btn:hover {
        background: var(--primary);
        color: white;
    }

    /* ============== READER PAGE ============== */
    .reader-page {
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: #000;
        z-index: 3000;
        overflow-y: auto;
    }

    .reader-header {
        position: sticky;
        top: 0;
        background: var(--card-bg);
        padding: 15px 30px;
        display: flex;
        justify-content: space-between;
        align-items: center;
        z-index: 10;
        border-bottom: 2px solid var(--primary);
        backdrop-filter: blur(10px);
        -webkit-backdrop-filter: blur(10px);
    }

    .reader-title {
        color: var(--text);
        font-weight: 600;
        font-size: 1rem;
        text-align: center;
        flex: 1;
        margin: 0 15px;
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
    }

    .reader-controls {
        display: flex;
        gap: 15px;
        align-items: center;
        flex-shrink: 0;
    }

    .reader-nav-btn {
        background: var(--hover);
        border: 1px solid var(--border);
        color: var(--text);
        width: 40px;
        height: 40px;
        border-radius: 50%;
        cursor: pointer;
        transition: var(--transition);
        display: flex;
        align-items: center;
        justify-content: center;
    }

    .reader-nav-btn:hover {
        background: var(--primary);
    }

    #chapterIndicator {
        color: var(--text-muted);
        font-size: 0.9rem;
        min-width: 80px;
        text-align: center;
    }

    .reader-body {
        padding: 30px;
        display: flex;
        flex-direction: column;
        align-items: center;
        gap: 20px;
        max-width: 900px;
        margin: 0 auto;
    }

    .reader-body img {
        max-width: 100%;
        max-height: 95vh;
        border-radius: 10px;
        display: block;
        box-shadow: 0 4px 20px rgba(0,0,0,0.5);
    }

    /* ============== DOWNLOAD MODAL ============== */
    .modal {
        display: none;
        position: fixed;
        top: 0;
        left: 0;
        width: 100%;
        height: 100%;
        background: rgba(0,0,0,0.8);
        z-index: 4000;
        align-items: center;
        justify-content: center;
    }

    .modal.show {
        display: flex;
    }

    .modal-content {
        background: var(--card-bg);
        margin: 20px;
        max-width: 450px;
        width: 100%;
        border-radius: 20px;
        border: 2px solid var(--primary);
        box-shadow: var(--neon);
        animation: modalFadeIn 0.3s ease;
    }

    @keyframes modalFadeIn {
        from { opacity: 0; transform: scale(0.9); }
        to { opacity: 1; transform: scale(1); }
    }

    .modal-header {
        padding: 20px 25px;
        border-bottom: 1px solid var(--border);
        display: flex;
        justify-content: space-between;
        align-items: center;
    }

    .modal-header h3 {
        display: flex;
        align-items: center;
        gap: 10px;
        font-size: 1.2rem;
    }

    .modal-header h3 i {
        color: var(--primary);
    }

    .close-modal {
        background: none;
        border: none;
        color: var(--text-muted);
        font-size: 1.5rem;
        cursor: pointer;
        transition: var(--transition);
        padding: 0 5px;
    }

    .close-modal:hover {
        color: var(--text);
        transform: rotate(90deg);
    }

    .modal-body {
        padding: 25px;
    }

    #downloadChapterInfo {
        margin-bottom: 20px;
        padding: 15px;
        background: rgba(0,0,0,0.2);
        border-radius: 10px;
    }

    #downloadChapterInfo h4 {
        color: var(--primary);
        margin-bottom: 5px;
    }

    #downloadChapterInfo p {
        color: var(--text);
        margin-bottom: 3px;
    }

    #downloadChapterInfo small {
        color: var(--text-muted);
    }

    .quality-options {
        display: flex;
        gap: 20px;
        margin: 20px 0;
    }

    .quality-option {
        display: flex;
        align-items: center;
        gap: 8px;
        cursor: pointer;
        color: var(--text);
    }

    .quality-option input[type="radio"] {
        accent-color: var(--primary);
        width: 16px;
        height: 16px;
        cursor: pointer;

    };

    // ============== HISTORY MANAGEMENT FOR BACK BUTTON ==============

    let viewHistory = [];
    let isHistoryListening = false;

    function pushViewState(view, data = null) {
        const state = { view, data };
        viewHistory.push(state);
        
        if (window.history) {
            const url = new URL(window.location);
            url.searchParams.set('view', view);
            if (data) {
                url.searchParams.set('data', JSON.stringify(data));
            }
            window.history.pushState(state, '', url);
        }
    }

    function popViewState() {
        if (viewHistory.length > 1) {
            viewHistory.pop();
            return viewHistory[viewHistory.length - 1];
        }
        return null;
    }

    function closeAllOverlays() {
        if (detailsPage) detailsPage.style.display = 'none';
        if (readerPage) readerPage.style.display = 'none';
        if (mainContainer) mainContainer.style.display = 'block';
        document.body.style.overflow = 'auto';
    }

    function closeDetails() {
        if (detailsPage) {
            detailsPage.style.display = 'none';
            if (mainContainer) mainContainer.style.display = 'block';
            document.body.style.overflow = 'auto';
        }
    }

    function closeReader() {
        if (readerPage) {
            readerPage.style.display = 'none';
            if (detailsPage) detailsPage.style.display = 'block';
            document.body.style.overflow = 'auto';
        }
    }

    function setupHistoryListener() {
        if (isHistoryListening) return;
        isHistoryListening = true;
        
        window.addEventListener('popstate', (event) => {
            const state = event.state;
            
            if (!state || state.view === 'home') {
                closeAllOverlays();
                showHome();
                return;
            }
            
            if (state.view === 'details') {
                closeDetails();
            } else if (state.view === 'reader') {
                closeReader();
            } else {
                closeAllOverlays();
                showHome();
            }
        });
    }

    function initializeHistory() {
        setupHistoryListener();
        pushViewState('home');
    }

    // Initialize
    document.addEventListener('DOMContentLoaded', () => {
        initializeDOMElements();
        initializeApp();
    });

    function initializeDOMElements() {
        mainContainer = document.getElementById('mainContainer');

        searchInput = document.getElementById('searchInput');
        searchBtn = document.getElementById('searchBtn');
        menuToggle = document.getElementById('menuToggle');
        themeToggle = document.getElementById('themeToggle');
        backToTop = document.getElementById('backToTop');

    async function loadPopularManga() {
        if (isLoading || !hasMoreResults) return;
        
        isLoading = true;
        if (loadingIndicator) loadingIndicator.style.display = 'block';
        
        try {
            const limit = 30;
            const url = `${MANGADEX_URL}/manga?limit=${limit}&offset=${currentOffset}&includes[]=cover_art&contentRating[]=safe&contentRating[]=suggestive&availableTranslatedLanguage[]=en&order[followedCount]=desc`;
            
            const response = await fetch(url, { headers: FETCH_HEADERS });
            
            if (!response.ok) throw new Error('API error');
            
            const data = await response.json();
            
            if (!data.data || data.data.length === 0) {
                hasMoreResults = false;
                if (endResults) endResults.style.display = 'block';
                return;
            }
            
            displayManga(data.data);
            
            currentOffset += limit;
            hasMoreResults = data.data.length === limit;
            
            if (!hasMoreResults && endResults) {
                endResults.style.display = 'block';
            }
            
        } catch (error) {
            console.error('Error loading popular:', error);
            showToast('Failed to load popular manga', 'error');
        } finally {
            isLoading = false;
            if (loadingIndicator) loadingIndicator.style.display = 'none';
        }

                        📦 ZIP FILE

                    ${downloads.map(d => `

    // ============== LOAD MANGA FROM MANGADEX ==============

    async function loadManga() {
        if (isLoading || !hasMoreResults || currentView !== 'home') return;
        
        isLoading = true;
        if (loadingIndicator) loadingIndicator.style.display = 'block';
        
        try {
            const limit = 30;
            
            if (currentOffset + limit > 10000) {
                hasMoreResults = false;
                if (endResults) endResults.style.display = 'block';
                return;
            }
            
            let url = `${MANGADEX_URL}/manga?limit=${limit}&offset=${currentOffset}&includes[]=cover_art&contentRating[]=safe&contentRating[]=suggestive&availableTranslatedLanguage[]=en`;
            
            if (currentQuery) {
                url += `&title=${encodeURIComponent(currentQuery)}`;
            } else {
                const genres = ['action', 'adventure', 'comedy', 'fantasy'];
                genres.forEach(g => {
                    if (GENRE_IDS[g]) {
                        url += `&includedTags[]=${GENRE_IDS[g]}`;
                    }
                });
                url += `&includedTagsMode=OR`;
                
                const sortOptions = ['followedCount', 'createdAt', 'updatedAt', 'rating'];
                const randomSort = sortOptions[Math.floor(Math.random() * sortOptions.length)];
                const randomDir = Math.random() > 0.5 ? 'desc' : 'asc';
                url += `&order[${randomSort}]=${randomDir}`;
            }
            
            if (currentGenre !== 'all' && GENRE_IDS[currentGenre]) {
                url += `&includedTags[]=${GENRE_IDS[currentGenre]}`;
            }
            
            const response = await fetch(url, { headers: FETCH_HEADERS });
            
            if (!response.ok) throw new Error('API error');
            
            const data = await response.json();
            
            if (!data.data || data.data.length === 0) {
                hasMoreResults = false;
                if (endResults) endResults.style.display = 'block';
                return;
            }
            
            let mangaToDisplay = [...data.data];
            if (!currentQuery) {
                for (let i = mangaToDisplay.length - 1; i > 0; i--) {
                    const j = Math.floor(Math.random() * (i + 1));
                    [mangaToDisplay[i], mangaToDisplay[j]] = [mangaToDisplay[j], mangaToDisplay[i]];
                }
            }
            
            displayManga(mangaToDisplay);
            
            currentOffset += limit;
            hasMoreResults = data.data.length === limit;
            
            if (!hasMoreResults && endResults) {
                endResults.style.display = 'block';
            }
            
        } catch (error) {
            console.error('Error loading manga:', error);
            showToast('Failed to load manga', 'error');
        } finally {
            isLoading = false;
            if (loadingIndicator) loadingIndicator.style.display = 'none';
        }
    }

// ============== FETCH MANGA STATS FOR RATINGS ==============

async function fetchMangaStats(mangaList) {
    try {
        console.log(`📊 Fetching stats for ${mangaList.length} manga (3 at a time)`);
        
        const cards = resultsContainer.querySelectorAll('.manga-card');
        let successCount = 0;
        
        // ✅ Process 3 at a time
        const batchSize = 3;
        
        for (let i = 0; i < mangaList.length; i += batchSize) {
            const batch = mangaList.slice(i, i + batchSize);
            
            console.log(`📊 Processing batch ${Math.floor(i / batchSize) + 1}/${Math.ceil(mangaList.length / batchSize)} (${batch.length} manga)`);
            
            // Fetch all manga in this batch in parallel
            const batchPromises = batch.map(async (manga) => {
                try {
                    const response = await fetch(`${MANGADEX_URL}/statistics/manga/${manga.id}`, {
                        headers: FETCH_HEADERS
                    });
                    
                    if (!response.ok) {
                        return { manga, rating: 'N/A' };
                    }
                    
                    const data = await response.json();
                    const mangaStats = data.statistics?.[manga.id];
                    
                    if (!mangaStats) {
                        return { manga, rating: 'N/A' };
                    }
                    
                    let rating = 'N/A';
                    if (mangaStats.rating) {
                        if (mangaStats.rating.bayesian && mangaStats.rating.bayesian > 0) {
                            rating = mangaStats.rating.bayesian.toFixed(1);
                        } else if (mangaStats.rating.average && mangaStats.rating.average > 0) {
                            rating = mangaStats.rating.average.toFixed(1);
                        }
                    }
                    
                    return { manga, rating };
                    
                } catch (error) {
                    console.warn(`⚠️ Error for ${manga.id}:`, error.message);
                    return { manga, rating: 'N/A' };
                }
            });
            
            // Wait for all requests in this batch to complete
            const batchResults = await Promise.all(batchPromises);
            
            // Process results
            batchResults.forEach(({ manga, rating }) => {
                if (rating === 'N/A') return;
                
                // Find card by data-manga-id
                let card = null;
                for (let j = 0; j < cards.length; j++) {
                    if (cards[j].dataset.mangaId === manga.id) {
                        card = cards[j];
                        break;
                    }
                }
                
                if (card) {
                    const ratingSpan = card.querySelector('.rating-span .rating-value');
                    const starIcon = card.querySelector('.rating-span i.fa-star');
                    
                    if (ratingSpan && rating !== 'N/A') {
                        animateRatingCounter(ratingSpan, starIcon, parseFloat(rating));
                        successCount++;
                    }
                }
            });
            
            // ✅ Small delay between batches (300ms) to avoid rate limiting
            if (i + batchSize < mangaList.length) {
                await new Promise(resolve => setTimeout(resolve, 300));
            }
        }
        
        console.log(`✅ Done! ${successCount}/${mangaList.length} ratings loaded in ~${Math.round(mangaList.length / 3 * 0.3)}s`);
        
    } catch (error) {
        console.warn('⚠️ Stats fetch error:', error);
    }
}

    // ============== ANIMATED RATING COUNTER ==============

    function animateRatingCounter(element, starIcon, targetRating) {
        if (isNaN(targetRating) || targetRating <= 0) {
            element.textContent = 'N/A';
            return;
        }
        
        const currentText = element.textContent;
        let startValue = 0;
        
        // ✅ FIX: Check if current text is "FREE" or "?"
        if (currentText === 'FREE' || currentText === '?' || currentText === 'N/A') {
            startValue = 0;  // Start from 0
        } else if (!isNaN(parseFloat(currentText)) && currentText !== 'N/A') {
            startValue = parseFloat(currentText);
            if (Math.abs(startValue - targetRating) < 0.01) {
                updateRatingColor(element, targetRating);
                return;
            }
        }
        
        const duration = Math.min(800 + (targetRating * 50), 1500);
        const steps = Math.min(Math.floor(targetRating) + 1, 10);
        const stepDuration = duration / steps;
        
        let currentStep = 0;
        
        element.classList.add('counting');
        
        if (starIcon) {
            starIcon.classList.add('pulse-star');
            setTimeout(() => {
                starIcon.classList.remove('pulse-star');
            }, 600);
        }
        
        if (element._counterInterval) {
            clearInterval(element._counterInterval);
        }
        
        element._counterInterval = setInterval(() => {
            currentStep++;
            
            const progress = currentStep / steps;
            const eased = 1 - Math.pow(1 - progress, 3);
            const currentValue = eased * targetRating;
            
            if (currentValue >= targetRating * 0.98) {
                element.textContent = targetRating.toFixed(1);
                element.classList.remove('counting');
                
                updateRatingColor(element, targetRating);
                
                element.style.transform = 'scale(1.2)';
                setTimeout(() => {
                    element.style.transform = 'scale(1)';
                }, 200);
                
                clearInterval(element._counterInterval);
                element._counterInterval = null;
                
            } else {
                if (currentValue < 1) {
                    element.textContent = currentValue.toFixed(1);
                } else {
                    const displayValue = Math.floor(currentValue);
                    if (displayValue > 0) {
                        element.textContent = displayValue;
                    } else {
                        element.textContent = currentValue.toFixed(1);
                    }
                }
                
                updateRatingColor(element, currentValue);
            }
            
        }, stepDuration);
    }

    // ============== UPDATE RATING COLOR ==============

    function updateRatingColor(element, rating) {
        element.classList.remove('excellent', 'good', 'average', 'poor');
        
        if (rating >= 8.0) {
            element.classList.add('excellent');
            element.style.textShadow = '0 0 20px rgba(255, 215, 0, 0.4)';
        } else if (rating >= 6.0) {
            element.classList.add('good');
            element.style.textShadow = '0 0 15px rgba(255, 165, 0, 0.3)';
        } else if (rating >= 4.0) {
            element.classList.add('average');
            element.style.textShadow = '0 0 10px rgba(255, 107, 107, 0.3)';
        } else {
            element.classList.add('poor');
            element.style.textShadow = '0 0 10px rgba(255, 71, 87, 0.3)';
        }
    }

    async function fetchAllChapters(mangaId) {
        let chapters = [];
        let offset = 0;
        const limit = 100;
        let hasMore = true;
        
        try {
            while (hasMore) {
                const response = await fetch(
                    `${MANGADEX_URL}/chapter?manga=${mangaId}&translatedLanguage[]=en&limit=${limit}&offset=${offset}&order[chapter]=asc&contentRating[]=safe&contentRating[]=suggestive`,
                    { headers: FETCH_HEADERS }
                );
                
                if (!response.ok) break;
                
                const data = await response.json();
                
                if (data.data.length === 0) {
                    hasMore = false;
                    break;
                }
                
                const validChapters = data.data.filter(ch => ch.attributes.pages > 0);
                chapters = [...chapters, ...validChapters];
                offset += limit;
                
                if (data.total && offset >= data.total) {
                    hasMore = false;
                }
            }
            
            chapters.sort((a, b) => {
                const numA = parseFloat(a.attributes.chapter) || 999999;
                const numB = parseFloat(b.attributes.chapter) || 999999;
                return numA - numB;
            });
            
        } catch (error) {
            console.error('Error fetching chapters:', error);
        }
        
        return chapters;
    }

function updateLoadingProgress(percentage) {

// ============== PRELOAD IMAGES ==============

function preloadImages(imageUrls) {
    return new Promise((resolve) => {
        let loadedCount = 0;
        const totalImages = imageUrls.length;
        
        if (totalImages === 0) {
            resolve();
            return;
        }
        
        // ✅ Update progress as images load
        function updateProgress() {
            loadedCount++;
            const percent = Math.min(85 + (loadedCount / totalImages) * 15, 99);
            updateLoadingProgress(percent);
        }
        
        // Load each image
        imageUrls.forEach((url, index) => {
            const img = new Image();
            img.crossOrigin = 'anonymous';
            
            img.onload = () => {
                updateProgress();
                if (loadedCount === totalImages) {
                    resolve();
                }
            };
            
            img.onerror = () => {
                // Still count as loaded even if error (show placeholder)
                updateProgress();
                if (loadedCount === totalImages) {
                    resolve();
                }
            };
            
            // Start loading
            img.src = url;
            
            // If image takes too long, still resolve
            setTimeout(() => {
                if (loadedCount === totalImages) {
                    resolve();
                }
            }, 15000); // 15 second timeout
        });
    });
}

    // ============== START DOWNLOAD ==============

    async function startDownload() {
        // Always use original quality (best experience)
        const quality = 'data';
        
        if (!selectedChapter) {
            showToast('No chapter selected ❌', 'error');
            return;
        }
        
        // Show progress
        const progress = document.getElementById('downloadProgress');
        const progressFill = document.getElementById('progressFill');
        const progressText = document.getElementById('progressText');
        
        if (progress) {
            progress.style.display = 'block';
            progress.classList.add('show');
        }
        if (progressFill) progressFill.style.width = '0%';
        if (progressText) progressText.textContent = 'Preparing download...';
        
        // Close modal
        downloadOptionsModal.style.display = 'none';
        
        try {
            showToast('📦 Downloading chapter...', 'info');
            
            // Always use 'data' quality (original)
            const downloadUrl = `/api/download/chapter/${selectedChapter.id}?quality=data&title=${encodeURIComponent(selectedChapter.mangaTitle)}&chapter=${selectedChapter.number}`;
            
            console.log('📥 Download URL:', downloadUrl);
            
            if (progressFill) progressFill.style.width = '20%';
            if (progressText) progressText.textContent = 'Fetching chapter...';
            
            const response = await fetch(downloadUrl);
            
            if (!response.ok) {
                let errorMsg = 'Download failed';
                try {
                    const errorData = await response.json();
                    errorMsg = errorData.message || errorMsg;
                } catch (e) {}
                throw new Error(errorMsg);
            }
            
            if (progressFill) progressFill.style.width = '50%';
            if (progressText) progressText.textContent = 'Creating ZIP file...';
            
            // Get filename
            const contentDisposition = response.headers.get('content-disposition');
            let filename = `${selectedChapter.mangaTitle.replace(/[^a-z0-9]/gi, '_')}_Chapter_${selectedChapter.number}.zip`;
            if (contentDisposition) {
                const match = contentDisposition.match(/filename="(.+)"/);
                if (match) filename = match[1];
            }
            
            // Get file as blob
            const blob = await response.blob();
            
            if (progressFill) progressFill.style.width = '80%';
            if (progressText) progressText.textContent = 'Saving file...';
            
            // Create download link
            const url = URL.createObjectURL(blob);
            const a = document.createElement('a');
            a.href = url;
            a.download = filename;
            document.body.appendChild(a);
            a.click();
            document.body.removeChild(a);
            URL.revokeObjectURL(url);
            
            if (progressFill) progressFill.style.width = '100%';
            if (progressText) progressText.textContent = '📢 Download complete 💌';
            
            // Save to downloads history
            saveDownloadHistory(selectedChapter.mangaTitle, selectedChapter.number);
            
            showToast('🎉 File Upload complete 🧧', 'success');
            
            // Re-fetch downloads to update the Downloads tab
            downloadedChapters = JSON.parse(localStorage.getItem('downloadedChapters')) || [];
            
            setTimeout(() => {
                if (progress) {
                    progress.style.display = 'none';
                    progress.classList.remove('show');
                }
            }, 3000);
            
        } catch (error) {
            console.error('❌ Download error:', error);
            showToast('❌ Download failed: ' + error.message, 'error');
            
            setTimeout(() => {
                const progress = document.getElementById('downloadProgress');
                if (progress) {
                    progress.style.display = 'none';
                    progress.classList.remove('show');
                }
            }, 3000);
        }
    }

    // ============== UTILITIES ==============

    function handleScroll() {
        if (backToTop) {
            if (window.scrollY > 400) {  // ✅ Your modification: changed to 400px
                backToTop.classList.add('show');
            } else {
                backToTop.classList.remove('show');
            }
        }
        
        if (mainContainer?.style.display !== 'none' && !isLoading && hasMoreResults) {
            const scrollY = window.scrollY;
            const windowHeight = window.innerHeight;
            const documentHeight = document.documentElement.scrollHeight;
            
            if (scrollY + windowHeight >= documentHeight - 500) {
                if (currentView === 'popular') {
                    loadPopularManga();
                } else if (currentView === 'home') {
                    loadManga();
                }
            }
        }
    }

    function showToast(message, type = 'info') {
        if (!toastContainer) return;
        
        const toast = document.createElement('div');
        toast.className = `toast ${type}`;
        
        let icon = 'info-circle';
        if (type === 'success') icon = 'check-circle';
        if (type === 'error') icon = 'exclamation-circle';
        
        toast.innerHTML = `
            <i class="fas fa-${icon}"></i>
            <span>${message}</span>
        `;
        
        toastContainer.appendChild(toast);
        
        setTimeout(() => {
            toast.style.animation = 'fadeOut 0.3s ease';
            setTimeout(() => toast.remove(), 300);
        }, 3200);
    }
</script>
